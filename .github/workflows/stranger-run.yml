name: README stranger

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: README-stranger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stranger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run every README command keyless against this checkout
        env:
          TYPESAFE_API_KEY: ""
          JEV_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          XAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
        run: |
          set -euo pipefail
          env -u TYPESAFE_API_KEY -u JEV_API_KEY -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY -u XAI_API_KEY -u OPENROUTER_API_KEY \
            python3 scripts/stranger-run-jev-playground.py \
            --source "$GITHUB_WORKSPACE" \
            --expect docs/demos/upstream-repro/stranger-run-expected.tsv \
            --out "$RUNNER_TEMP/stranger-run.md" \
            --timeout 600

      - name: Upload stranger receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: README-stranger-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/stranger-run.md
          if-no-files-found: error
