name: gates

# W2.6 public CI backstop (moves jev out of RULEBOOK class C4). Runs every
# foundation gate keyless on ubuntu on push to main. The verdict is
# `bash foundation/gates.sh --portable` (and the same flag on --selftest),
# the command a stranger runs. A missing prerequisite is that script's own
# SKIP row (exit 8), counted, never remapped here. A run with skips is
# "green with N typed skips", never plain green. A planted defect must
# turn a run RED (proven live, see the W2.6 receipt); a green run that never
# saw RED is unproven.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      plant_red:
        description: "Plant a defect in the runner checkout only (nothing committed): 'fixture' appends garbage to the calibration fixture so stage 10 must RED naming it; 'suite' appends a failing test so the registered-suite job must RED naming that file; 'none' runs clean."
        required: false
        default: "none"
        type: choice
        options: [none, fixture, suite]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JEV_GATE_LOG: "0"
      # loop-kit (foundry, private repo) is absent on the public runner, so the
      # pre-commit wrapper's lane 2 would refuse every commit. The hook authors
      # provide this exact escape for checker-absent environments; it prints
      # AUTOFIX_LANE_SKIPPED (counted below as a typed skip, never a pass) and
      # leaves lane 1 (staged-deletion survival) fully enforced. Stage 60 then
      # proves its trigger + healthy witnesses for real on CI.
      JEV_ALLOW_MISSING_AUTOFIX: "1"
    steps:
      - name: "Checkout (full history: gate stages read git log)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plant defect in runner checkout only (dispatch input; never committed)
        if: inputs.plant_red == 'fixture'
        run: |
          set -u; set +e  # runner uses bash -e; stages report codes, never abort
          printf 'NOT-JSON-PLANTED-DEFECT-W26\n' >> foundation/fixtures/calibration-v1.jsonl
          echo "PLANTED: garbage line appended to foundation/fixtures/calibration-v1.jsonl; stage 10 must RED naming it"

      - name: Node 22.18+ (README.md:26; the client and tests import .ts directly)
        uses: actions/setup-node@v4
        with:
          node-version: '22.18'

      - name: ast-grep binary as `ast-grep` (stage 44 structural scan)
        # @ast-grep/cli ships prebuilt `sg`; stage 44 calls `ast-grep`.
        # Symlink, then prove the exact binary the stage invokes.
        run: |
          set -u
          npm install -g @ast-grep/cli
          sudo ln -sf "$(npm root -g)/.bin/sg" /usr/local/bin/ast-grep
          command -v ast-grep
          ast-grep --version

      - name: Toolchain proof line
        run: |
          set -u
          git --version
          python3 --version


      - name: ripgrep (stage 44 and friends scan with rg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep


      - name: Install br from official release asset (sha256-verified, no compile)
        # beads_rust 0.2.17 (the lane pin) has no prebuilt asset and does not
        # compile on stable (its asupersync dep needs nightly, E0554). The CI
        # db is throwaway: gates.sh requires .beads/*.db to EXIST, and no
        # stage reads it — so a verified official br binary is sufficient and
        # deterministic. If this ever changes, this step fails loudly.
        # GH_TOKEN: unauthenticated `gh release download` shares the runner IP's API quota and got
        # HTTP 403 (rate limit) on every run 08:03-08:29Z 2026-09-24; with `set +e` the step still
        # reported success and the next step died on `br: command not found`. Install is not a
        # gate stage, so any failure here stops the job at this step.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.6.0 --repo Dicklesworthstone/beads_rust \
            --pattern 'br-0.6.0-linux_amd64.tar.gz*' --dir /tmp/br-dl
          cd /tmp/br-dl
          sha256sum -c br-0.6.0-linux_amd64.tar.gz.sha256
          tar xzf br-0.6.0-linux_amd64.tar.gz
          ./br --version
          echo "/tmp/br-dl" >> "$GITHUB_PATH"

      - name: Import the bead store with released br
        run: |
          set -u
          br sync --import-only
          ls .beads/*.db
      - name: Run all gates (keyless; --portable, the stranger's command)
        id: gates
        run: |
          set -u; set +e  # runner uses bash -e; gates.sh reports rc, never aborts
          bash foundation/gates.sh --portable > /tmp/gates-run.txt 2>&1; echo "rc=$?" > /tmp/gates-rc.txt
          cat /tmp/gates-run.txt

      - name: "Run gates.sh --selftest --portable (same SKIP rule as the run)"
        id: selftests
        run: |
          set -u; set +e  # runner uses bash -e; gates.sh reports rc, never aborts
          bash foundation/gates.sh --selftest --portable > /tmp/selftest-run.txt 2>&1; echo "rc=$?" > /tmp/selftest-rc.txt
          cat /tmp/selftest-run.txt
          exit 0

      - name: Diagnose RED stages with full output (log only; does not change the verdict)
        # A RED row already names the failing sub-check. This rerun is a log of
        # the three environment-sensitive stages when they are RED. It does not
        # remap a RED into a SKIP; --portable already did that, or it did not.
        run: |
          set -u; set +e
          for st in 50-house-gates 60-staged-deletion-lane 80-lane-instrument-selftests; do
            if grep -q "^RED  $st " /tmp/gates-run.txt 2>/dev/null; then
              "foundation/gates.d/$st.sh" > "/tmp/diag-$st.txt" 2>&1
              echo "$st diag_rc=$?" | tee -a /tmp/diag-rc.txt
            else
              echo "$st not-red-in-gates" | tee -a /tmp/diag-rc.txt
            fi
          done
          echo "diagnose is a log; the verdict does not read it"
          exit 0

      - name: Verdict (RED fails; SKIP is gates.sh's own row, never remapped)
        run: |
          set -u; set +e  # runner uses bash -e; verdict computes, never aborts early
          gates_rc=$(cut -d= -f2 /tmp/gates-rc.txt)
          selftest_rc=$(cut -d= -f2 /tmp/selftest-rc.txt)
          echo "===== gates.sh --portable ====="; cat /tmp/gates-run.txt
          echo "===== gates.sh --selftest --portable ====="; cat /tmp/selftest-run.txt
          echo "===== typed skips (not passes) ====="
          grep -h "^SKIP " /tmp/gates-run.txt /tmp/selftest-run.txt 2>/dev/null || true
          skips=$(grep -hc "^SKIP " /tmp/gates-run.txt /tmp/selftest-run.txt 2>/dev/null | awk '{s+=$1} END{print s+0}')
          echo "skip_lines=$skips"
          if [ "$gates_rc" != "0" ] || [ "$selftest_rc" != "0" ]; then
            echo "VERDICT: RED (gates_rc=$gates_rc selftest_rc=$selftest_rc)"
            exit 1
          fi
          if [ "$skips" != "0" ]; then
            echo "VERDICT: GREEN WITH $skips TYPED SKIPS (gates.sh --portable; never plain green)"
            exit 0
          fi
          echo "VERDICT: ALL GREEN"

  registered-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22.18+ (README.md:26)
        uses: actions/setup-node@v4
        with:
          node-version: '22.18'

      - name: Install the prerequisites the suite command names
        run: |
          set -euo pipefail
          npm ci --prefix work/sdk
          ./scripts/bootstrap-compaction.sh
          ./scripts/sync-docs.sh --repos-only

      - name: Plant a suite defect in the runner checkout only
        if: inputs.plant_red == 'suite'
        run: |
          set -euo pipefail
          cat >> work/sr-adopt/test_prereg.py << 'EOF'

          import unittest
          class PlantedSuiteDefect(unittest.TestCase):
              def test_planted(self):
                  self.fail("planted")
          EOF
          echo "PLANTED: work/sr-adopt/test_prereg.py"

      - name: Run registered suites
        run: |
          set -u
          set +e
          python3 scripts/run-registered-suites.py > /tmp/suites.tsv
          rc=$?
          cat /tmp/suites.tsv
          if [ "${{ inputs.plant_red }}" = "suite" ]; then
            if grep -F $'work/sr-adopt/test_prereg.py\t' /tmp/suites.tsv | grep -q $'\tFAIL$'; then
              echo "RED named work/sr-adopt/test_prereg.py"
              exit 1
            fi
            echo "PLANT DID NOT FAIL work/sr-adopt/test_prereg.py"
            exit 1
          fi
          exit "$rc"
