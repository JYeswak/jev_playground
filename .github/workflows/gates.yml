name: gates

# W2.6 public CI backstop (moves jev out of RULEBOOK class C4). Runs every
# foundation gate keyless on ubuntu on push to main, plus every stage's
# --selftest RED arm. omp is NOT installed here: stages that need the omp
# binary degrade to typed SKIP lines (selftest-ttsr-*.sh say so themselves);
# the verdict step counts SKIP lines separately from PASS. A run with skips
# is "green with N typed skips", never plain green. A planted defect must
# turn a run RED (proven live, see the W2.6 receipt); a green run that never
# saw RED is unproven.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      plant_red:
        description: "Plant a defect in the runner checkout only (nothing committed): 'fixture' appends garbage to the calibration fixture so stage 10 must RED naming it; 'none' runs clean."
        required: false
        default: "none"
        type: choice
        options: [none, fixture]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JEV_GATE_LOG: "0"
      # loop-kit (foundry, private repo) is absent on the public runner, so the
      # pre-commit wrapper's lane 2 would refuse every commit. The hook authors
      # provide this exact escape for checker-absent environments; it prints
      # AUTOFIX_LANE_SKIPPED (counted below as a typed skip, never a pass) and
      # leaves lane 1 (staged-deletion survival) fully enforced. Stage 60 then
      # proves its trigger + healthy witnesses for real on CI.
      JEV_ALLOW_MISSING_AUTOFIX: "1"
    steps:
      - name: "Checkout (full history: gate stages read git log)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plant defect in runner checkout only (dispatch input; never committed)
        if: inputs.plant_red == 'fixture'
        run: |
          set -u; set +e  # runner uses bash -e; stages report codes, never abort
          printf 'NOT-JSON-PLANTED-DEFECT-W26\n' >> foundation/fixtures/calibration-v1.jsonl
          echo "PLANTED: garbage line appended to foundation/fixtures/calibration-v1.jsonl; stage 10 must RED naming it"

      - name: Node 20 (stage 40 transcript adapter)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ast-grep binary as `ast-grep` (stage 44 structural scan)
        # @ast-grep/cli ships prebuilt `sg`; stage 44 calls `ast-grep`.
        # Symlink, then prove the exact binary the stage invokes.
        run: |
          set -u
          npm install -g @ast-grep/cli
          sudo ln -sf "$(npm root -g)/.bin/sg" /usr/local/bin/ast-grep
          command -v ast-grep
          ast-grep --version

      - name: Toolchain proof line
        run: |
          set -u
          git --version
          python3 --version


      - name: ripgrep (stage 44 and friends scan with rg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep


      - name: Install br from official release asset (sha256-verified, no compile)
        # beads_rust 0.2.17 (the lane pin) has no prebuilt asset and does not
        # compile on stable (its asupersync dep needs nightly, E0554). The CI
        # db is throwaway: gates.sh requires .beads/*.db to EXIST, and no
        # stage reads it — so a verified official br binary is sufficient and
        # deterministic. If this ever changes, this step fails loudly.
        run: |
          set -u; set +e  # runner uses bash -e; stages report codes, never abort
          cd /tmp
          gh release download v0.6.0 --repo Dicklesworthstone/beads_rust \
            --pattern 'br-0.6.0-linux_amd64.tar.gz*' --dir /tmp/br-dl
          cd /tmp/br-dl
          sha256sum -c br-0.6.0-linux_amd64.tar.gz.sha256
          tar xzf br-0.6.0-linux_amd64.tar.gz
          ./br --version
          echo "/tmp/br-dl" >> "$GITHUB_PATH"

      - name: Import the bead store with released br
        run: |
          set -u
          br sync --import-only
          ls .beads/*.db
      - name: Run all gates (keyless; no key in env by construction)
        id: gates
        run: |
          set -u; set +e  # runner uses bash -e; gates.sh reports rc, never aborts
          ./foundation/gates.sh > /tmp/gates-run.txt 2>&1; echo "rc=$?" > /tmp/gates-rc.txt
          cat /tmp/gates-run.txt

      - name: "Run every stage --selftest (RED arms; mirrors gates.sh: skips non-executables)"
        id: selftests
        run: |
          set -u; set +e  # runner uses bash -e; stages report codes, never abort
          : > /tmp/selftest-run.txt; : > /tmp/selftest-rc.txt
          fail=0
          for stage in foundation/gates.d/[0-9]*-*.sh; do

            [ -x "$stage" ] || continue
            name=$(basename "$stage" .sh)
            out=$("$stage" --selftest 2>&1); code=$?
            printf '### %s (rc=%s)\n%s\n' "$name" "$code" "$out" >> /tmp/selftest-run.txt
            echo "$name $code" >> /tmp/selftest-rc.txt
            [ "$code" -eq 0 ] || fail=1
          done
          echo "fail=$fail" | tee /tmp/selftest-fail.txt
          exit 0

      - name: Diagnose RED stages with full output (only reruns stages gates marked RED)
        # gates.sh truncates stage output to 300 chars; the typed-SKIP mapping
        # below needs full outputs, so RED stages among the three
        # environment-sensitive ones are rerun here. A rerun that goes green
        # means flake (stays RED); a rerun with the same environmental
        # signature feeds the mapping. This step never changes a verdict.
        run: |
          set -u; set +e
          for st in 50-house-gates 60-staged-deletion-lane 80-lane-instrument-selftests; do
            if grep -q "^RED  $st " /tmp/gates-run.txt 2>/dev/null; then
              "foundation/gates.d/$st.sh" > "/tmp/diag-$st.txt" 2>&1
              echo "$st diag_rc=$?" | tee -a /tmp/diag-rc.txt
            else
              echo "$st not-red-in-gates" | tee -a /tmp/diag-rc.txt
            fi
          done
          echo "--- machine facts for mapping ---" | tee /tmp/diag-facts.txt
          command -v omp >/dev/null 2>&1 && echo "omp present" | tee -a /tmp/diag-facts.txt || echo "omp absent" | tee -a /tmp/diag-facts.txt
          test -f "$HOME/.omp/omp-extensions/ee-ambient-session-start.ts" && echo "home-ee present" | tee -a /tmp/diag-facts.txt || echo "home-ee absent" | tee -a /tmp/diag-facts.txt
          exit 0

      - name: Verdict (RED fails; SKIP counted apart from PASS, never as PASS)
        run: |
          set -u; set +e  # runner uses bash -e; verdict computes, never aborts early
          gates_rc=$(cut -d= -f2 /tmp/gates-rc.txt)
          selftest_fail=$(cut -d= -f2 /tmp/selftest-fail.txt)
          echo "===== gates.sh ====="; cat /tmp/gates-run.txt
          echo "===== selftests ====="; cat /tmp/selftest-run.txt
          echo "===== typed skips (not passes) ====="
          grep -h "SKIP" /tmp/gates-run.txt /tmp/selftest-run.txt 2>/dev/null || true
          skips=$(grep -h "SKIP" /tmp/gates-run.txt /tmp/selftest-run.txt 2>/dev/null | wc -l | tr -d ' ')
          echo "skip_lines=$skips"
          # ---- typed-SKIP mapping (environment-blocked stages) ----
          # Each rule needs ALL of: the stage RED, the exact environmental
          # signature in its full-output rerun, and the machine fact.
          # Anything else RED stays RED. Rules live here (reviewed workflow),
          # never in a gate. No gate file was touched for CI.
          skip_extra=0
          # 50: loop-kit is a private-repo instrument; exit 3 + exact message.
          if grep -q "^RED  50-house-gates " /tmp/gates-run.txt 2>/dev/null \
            && grep -q "50-house-gates diag_rc=3" /tmp/diag-rc.txt 2>/dev/null \
            && grep -q "house gates unreachable" /tmp/diag-50-house-gates.txt 2>/dev/null; then
            echo "SKIP stage-50 (run): loop-kit private instrument absent (exit 3, exact message)"
            skip_extra=$((skip_extra+1)); map50run=1
          fi
          # 80: EVERY failing suite is selftest-consumer-check.sh (needs $HOME
          # ee/dcg tooling, absent) and omp is absent (TTSR SKIPs prove it).
          if grep -q "^RED  80-lane-instrument-selftests " /tmp/gates-run.txt 2>/dev/null \
            && [ -f /tmp/diag-80-lane-instrument-selftests.txt ] \
            && grep -q "^home-ee absent$" /tmp/diag-facts.txt 2>/dev/null \
            && grep -q "^omp absent$" /tmp/diag-facts.txt 2>/dev/null; then
            red_total=$(awk '/^  RED /{n++} END{print n+0}' /tmp/diag-80-lane-instrument-selftests.txt)
            red_other=$(awk '/^  RED / && !/selftest-consumer-check\.sh/{n++} END{print n+0}' /tmp/diag-80-lane-instrument-selftests.txt)
            if [ "$red_total" != "0" ] && [ "$red_other" = "0" ]; then
              echo "SKIP stage-80 (run): only selftest-consumer-check.sh fails; needs absent \$HOME tooling"
              skip_extra=$((skip_extra+1)); map80run=1
            fi
          fi
          # 50-selftest: same instrument, same signature in its recorded section.
          if grep -q "^50-house-gates 3$" /tmp/selftest-rc.txt 2>/dev/null \
            && grep -q "house gates unreachable" /tmp/selftest-run.txt 2>/dev/null; then
            echo "SKIP stage-50 (selftest): loop-kit private instrument absent"
            skip_extra=$((skip_extra+1)); map50self=1
          fi
          # Effective verdict: RED unless every RED is mapped and selftests clean-or-mapped.
          [ -s /tmp/gates-run.txt ] || unmapped=1
          unmapped=${unmapped:-0}
          for st in $(grep "^RED  " /tmp/gates-run.txt 2>/dev/null | awk '{print $2}' || true); do
            case "$st" in
              50-house-gates) [ "${map50run:-0}" = "1" ] || unmapped=1 ;;
              80-lane-instrument-selftests) [ "${map80run:-0}" = "1" ] || unmapped=1 ;;
              *) unmapped=1 ;;
            esac
          done
          [ -s /tmp/selftest-rc.txt ] || selftest_bad=1
          selftest_bad=${selftest_bad:-0}
          for row in $(awk '{print $1":"$2}' /tmp/selftest-rc.txt 2>/dev/null || true); do
            nm=${row%%:*}; rc=${row##*:}
            case "$nm" in
              50-house-gates) if [ "${map50self:-0}" != "1" ]; then [ "$rc" = "0" ] || selftest_bad=1; fi ;;
              *) [ "$rc" = "0" ] || selftest_bad=1 ;;
            esac
          done
          if [ "$unmapped" != "0" ] || [ "$selftest_bad" != "0" ]; then
            echo "VERDICT: RED (unmapped_red=$unmapped selftest_bad=$selftest_bad)"
            exit 1
          fi
          if [ "$skips" != "0" ] || [ "$skip_extra" != "0" ]; then
            echo "VERDICT: GREEN WITH $((skips + skip_extra)) TYPED SKIPS (see SKIP lines above; never plain green)"
            exit 0
          fi
          echo "VERDICT: ALL GREEN"
