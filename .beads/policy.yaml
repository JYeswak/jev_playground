# Close-time invariants for the jev bead graph.
# Observed defects: authors closed their own beads (jev-xdzh, jev-pkn5, skillabandon, jev-i20b)
# and closes cited no evidence (conductor, 2026-10-02).
# Mission Protocol v0.1 P3 (approved by Joshua 2026-10-04): strict workflow with explicit
# transitions; every edge into `closed` passes a non-author reviewer gate. Without `strict`,
# open->closed and in_progress->closed bypass gates on br 0.7.4 (omp-test O3, measured).
workflow:
  strict: true
  statuses: [open, in_progress, in_review, rework, blocked, deferred, closed]
  transitions:
    initial: [open]
    open: [in_progress, blocked, deferred, closed]
    in_progress: [in_review, open, blocked, deferred]
    in_review: [closed, rework]
    rework: [in_progress]
    blocked: [open, in_progress]
    deferred: [open, closed]
    closed: [open]
  status_groups:
    ready: [open, rework]
  required_fields:
    in_review: [acceptance_criteria, transition_comment]
    closed: [transition_comment]
  gates:
    "in_review -> closed":
      require_all:
        - min_reviewers: 1
    "open -> closed":
      require_all:
        - min_reviewers: 1
    "deferred -> closed":
      require_all:
        - min_reviewers: 1
close_policy:
  forbid_self_close_after_in_progress:
    enabled: true
  require_typed_references:
    enabled: true
    required_kinds: [commit, investigation]
