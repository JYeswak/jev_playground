# Project-scope omp config. Precedence: defaults <- global <- project (omp://config-usage.md:160),
# and project .omp is scanned before user .omp, so this overrides the global order for this repo.
#
# ONE CHANGE, and only because it has both a mechanical argument and our own measurement behind it.
#
# WHY invert methodOrder. Global default is [remote, snapcompact, handoff, shake, soft] — `shake`
# runs FOURTH, behind three summarizers. omp already elides bulky tool output on the way into
# `session_before_compact`, so with shake last you pay an LLM to write a lossy summary of bulk that
# a recoverable `artifact://` placeholder would have handled for free. Cheap and recoverable work
# belongs first.
#
# What our own ledger already ruled, so nobody re-litigates it here:
#   * Jev-as-PRUNER is REFUSED (UP-R4). `keep_p` does not rank future need — AUC 0.348 / 0.522 /
#     0.648 across three real sessions, against a 0.941 positive control on the same harness, so
#     that is a null on the question and not a broken test.
#     (docs/demos/upstream-repro/compaction-positive-control-20260919.md,
#      compaction-retention-oracle-20260919.md, math-and-next-level-20260919.md:155)
#   * Keep-everything beat every pruner on mistakes: 12/4/13 vs 82/91/81. ~90% of tool results are
#     referenced again, and no threshold 0.1–0.9 beat keeping them.
#   * The real lever is retransmitted bulk: 98.878% of billed tokens over 4,619 sessions, marked
#     REPRODUCIBLE in readme-numeric-claims-audit-20260919.md via demos/usage-shape/bin/shape.mjs.
#     `shake` + supersedeReads + dropUseless remove that WITHOUT rewriting any decision.
#
# NOT ADOPTED, deliberately — these were suggested alongside and carry no measurement here:
#   * keepRecentTokens 20000 -> 24000: no evidence offered for the new number; left at the global.
#   * display.collapseCompacted: cosmetic, unmeasured.
#   * idleEnabled: stays OFF. Turning it on to "compact more" is how the 7x mistake regression
#     comes back. supersedeReads and dropUseless are already true globally and are not restated.
#
# RETIRE/REVISIT: if a session shows `shake` reporting "Nothing to shake" while the window is still
# tight, this repo is in the keep-everything / handoff regime and reordering buys nothing.
compaction:
  methodOrder: [shake, snapcompact, handoff, remote, soft]

# Added 2026-09-21 (pane 1, conductor). PROJECT-SCOPED registration — this file is in the repo and
# is reviewable in git. It is NOT a write under ~/.omp, which pane 4 correctly refused as a
# substrate change.
#
# WHY this key and not the bare directory. omp://extension-loading.md lists <cwd>/.omp/extensions
# as a native auto-discovery root, but native auto-discovery globs with `gitignore: true` and
# `hidden: false`. Explicitly configured paths take a different loader.ts code path that "does not
# apply gitignore filtering", and <cwd>/.omp/config.yml is a documented project settings source.
#
# PROVEN 2026-09-21, and this key is what makes it true:
#   grok  xd://jev_rerank_ext_probe present
#   muse  present
#   codex ABSENT  (open: codex is the only profile whose own array carries a profile-local
#                  extensions/ path; correlation, not mechanism)
#   --no-extensions  ABSENT  <- negative arm, so the probe discriminates
#
# DO NOT USE dumpTools AS THE ORACLE. `get_state.dumpTools` reports BUILT-INS ONLY and is blind to
# extension-registered tools. Demonstrated with a planted positive control: a minimal extension
# with no imports, registering one trivial tool via the documented pi.registerTool API, loaded by
# explicit absolute -e path, is ALSO absent from dumpTools. An earlier revision of this comment
# named dumpTools as the acceptance; that was the false-ZERO trap this lane spent the afternoon on.
#
# ACCEPTANCE (L2, listed): get_state.systemPrompt contains xd://jev_rerank_ext_probe, with a
# --no-extensions run as the negative arm. Grepping for `jev_rerank` alone proves NOTHING — that
# name comes from the .omp/tools catalog and survives --no-extensions.
# L3 (fires) is invocation, both directions, and is NOT claimed here.
# RETIRE: delete this key if the tool is withdrawn, or if native .omp/extensions discovery starts
# working and makes it redundant.


# jev-xw3f: after the 2026-09-25 05:57Z key exposure, redact provider-visible text,
# including tool results, using omp's built-ins and the TypeSafe regex in .omp/secrets.yml.
# Sessions started before this change remain unprotected until restart. The key arrives
# per command via infisical run, not omp's startup env-var collector, so the regex must
# catch it; local session logs still contain restored values.
secrets:
  enabled: true

# omp-kit (1).zip, installed 2026-09-23. Global ttsr.repeatMode is once, which
# the kit author measured as catching 1 of 6 back-to-back violations. after-gap
# with gap 0 caught all 6 on omp 18.2.10. Project config overrides the global.
ttsr:
  repeatMode: after-gap
  repeatGap: 0
  disabledRules:
    - absence-from-one-probe

# kit-guard is a directory extension. Native .omp/extensions discovery is not
# the loader this repo relies on. The list below is.
extensions:
  - ./.omp/extensions/jev-rerank.ts
  - ./.omp/extensions/jev-flag.ts
  - ./.omp/extensions/jev-screen.ts
  - ./.omp/extensions/jev-claim-check.ts
  - ./.omp/extensions/kit-guard
  # Operator safety baseline, restated on purpose. omp's settings merge REPLACES arrays
  # (pi-coding-agent src/config/settings.ts #deepMerge), so this project list otherwise
  # drops every extension the operator's profile lists: measured 2026-09-26, 3 of 4 jev
  # sessions had zero dcg-tool-bridge decisions. Keep these paths identical to the
  # profile lists (~/.omp/profiles/*/agent/config.yml); the loader dedupes by resolved
  # path. kit-guard-optin is omitted: this repo loads its own ./.omp/extensions/kit-guard.
  - /Users/josh/.omp/omp-extensions/observational-tool-result.ts
  - /Users/josh/.omp/omp-extensions/dcg-tool-bridge.ts
  - /Users/josh/.omp/omp-extensions/ee-failure-journal.ts
  - /Users/josh/.omp/omp-extensions/zeststream-cast-spawn-cap.ts
  - /Users/josh/.omp/omp-extensions/skill-topology-session-start.ts
  - /Users/josh/.omp/omp-extensions/ee-ambient-session-start.ts
  - /Users/josh/.omp/omp-extensions/zestgraph-danger-gate.ts
  - /Users/josh/.omp/omp-extensions/slb-guard-fail-closed.ts
  - /Users/josh/.omp/omp-extensions/rch-lane-bind-bridge.ts
  - /Users/josh/.omp/omp-extensions/rch-mutator.ts
#   (xd://jev_screen_ext_probe + nonce + --no-extensions arms), see
#   work/nev-injection/screen-l2-receipt.json. Retire with the tool.
